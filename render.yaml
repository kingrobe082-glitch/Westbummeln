# Render-Blueprint für Westbummeln (Django + Postgres).
# Vor dem ersten Deploy mit dieser Datei die Umzugsanleitung in KONTEN.md lesen.
databases:
  - name: westbummeln-db
    plan: basic-256mb          # Postgres Basic-256mb, ca. 6 $/Monat; läuft nicht wie Free nach 30 Tagen ab
    # Ohne region-Angabe legt Render Datenbank und Webdienst beide in Oregon an.
    # Liegt der Webdienst woanders, hier und unten dieselbe region eintragen (z. B. frankfurt).

services:
  - type: web
    name: westbummeln-multiplayer
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    # preDeployCommand gibt es nur für bezahlte Webdienste, deshalb laufen Migrationen beim Start.
    # Genau 1 Worker: Die Spielräume liegen im Arbeitsspeicher dieses einen Prozesses.
    startCommand: >-
      python manage.py migrate --noinput &&
      python manage.py bootstrap_accounts &&
      gunicorn westbummeln.wsgi --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 30
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: westbummeln-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
