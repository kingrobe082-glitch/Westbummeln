<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 100" width="230" height="100">
<!-- LF 10 (Löschgruppenfahrzeug, kleineres Fahrgestell, zwei Achsen) in Seitenansicht, Front nach links –
     passend zur LF-20-Seitenansicht und zum KdoW. Eigene Zeichnung für Westbummeln.
     Wird auf der Karte nur gespiegelt, nicht gedreht. -->
<defs>
  <linearGradient id="lack" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f03a30"/><stop offset="1" stop-color="#b81815"/>
  </linearGradient>
  <linearGradient id="glas" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3b4652"/><stop offset="1" stop-color="#1b2229"/>
  </linearGradient>
  <linearGradient id="rollo" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d9dde1"/><stop offset="1" stop-color="#9aa1a8"/>
  </linearGradient>
</defs>
<!-- Blaulichtbalken auf dem Fahrerhaus -->
<rect x="18" y="4" width="44" height="7" rx="3" fill="#1f3fbf" stroke="#0d1a55" stroke-width="1.5"/>
<rect x="21" y="5.5" width="14" height="4" rx="2" fill="#6fb6ff"/>
<rect x="45" y="5.5" width="14" height="4" rx="2" fill="#6fb6ff"/>
<!-- Leiter/Dachkasten auf dem Aufbau -->
<rect x="84" y="6" width="130" height="5" rx="1.5" fill="#c9ced3" stroke="#6d7379" stroke-width="1"/>
<path d="M92 6 V11 M104 6 V11 M116 6 V11 M128 6 V11 M140 6 V11 M152 6 V11 M164 6 V11 M176 6 V11 M188 6 V11 M200 6 V11" stroke="#6d7379" stroke-width="1"/>
<!-- Fahrerhaus (kurz, Front nach links) -->
<path d="M8 66 L9 30 Q10 13 24 12 L72 12 Q78 12 78 18 L78 74 L18 74 Q8 74 8 66 Z" fill="url(#lack)" stroke="#5a0a08" stroke-width="2"/>
<!-- Aufbau -->
<rect x="80" y="12" width="138" height="62" rx="4" fill="url(#lack)" stroke="#5a0a08" stroke-width="2"/>
<!-- weiße Schwellerzone wie beim LF 20 -->
<path d="M9 62 L217 62 L217 70 Q217 74 213 74 L18 74 Q9 74 9 68 Z" fill="#f2f2f2"/>
<!-- Fenster Fahrerhaus -->
<path d="M14 36 L16 22 Q17 17 23 17 L44 17 L44 36 Z" fill="url(#glas)"/>
<rect x="48" y="17" width="25" height="19" rx="2" fill="url(#glas)"/>
<path d="M46 17 L46 62" stroke="#7d100d" stroke-width="1.5"/>
<!-- Geräteräume mit Rollläden -->
<g fill="url(#rollo)" stroke="#6d7379" stroke-width="1">
  <rect x="86" y="17" width="40" height="40" rx="1.5"/>
  <rect x="131" y="17" width="40" height="40" rx="1.5"/>
  <rect x="176" y="17" width="37" height="40" rx="1.5"/>
</g>
<path d="M86 25 H126 M86 33 H126 M86 41 H126 M86 49 H126 M131 25 H171 M131 33 H171 M131 41 H171 M131 49 H171 M176 25 H213 M176 33 H213 M176 41 H213 M176 49 H213" stroke="#8a9198" stroke-width="1"/>
<!-- gelbe Warnstreifen -->
<rect x="10" y="57" width="207" height="5" fill="#f4e400"/>
<rect x="9" y="44" width="7" height="6" rx="1" fill="#fff3b0"/>
<rect x="213" y="20" width="4" height="10" rx="1" fill="#e0221b" stroke="#7d100d"/>
<!-- Beschriftung -->
<text x="60" y="49" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">LF 10</text>
<text x="150" y="71" font-family="Arial,Helvetica,sans-serif" font-size="8" font-weight="700" fill="#b81815" text-anchor="middle">FEUERWEHR</text>
<!-- Räder -->
<g fill="#1a1a1a"><circle cx="42" cy="76" r="16"/><circle cx="182" cy="76" r="16"/></g>
<g fill="#b9bec4" stroke="#6d7379" stroke-width="1.5"><circle cx="42" cy="76" r="8"/><circle cx="182" cy="76" r="8"/></g>
<g fill="#6d7379"><circle cx="42" cy="76" r="2.5"/><circle cx="182" cy="76" r="2.5"/></g>
</svg>
